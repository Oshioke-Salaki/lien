[package]
name = "sentinel"
description = "A paid pre-flight check for NEAR accounts, run as attested code inside OutLayer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
