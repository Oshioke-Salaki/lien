[workspace]
resolver = "2"
members = [
  "contracts/agent",
  "contracts/collector",
  "contracts/registry",
  "contracts/xvault",
  "contracts/lendvault",
  "contracts/notemarket",
  "contracts/reports",
  "contracts/mocks/token",
  "contracts/mocks/outlayer",
  "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Oshioke-Salaki/lien"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
