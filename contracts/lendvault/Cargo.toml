[package]
name = "lien-lendvault"
description = "A keyless vault that holds a lender agent's budget and lends it only to Lien businesses, within limits fixed at init"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
